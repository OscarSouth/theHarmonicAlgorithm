name: Cross-platform build

# Kept OFF the pull-request path deliberately: a weekly, automated form of the
# release-time "a fresh clone builds and tests" verification, so a drift in the
# toolchain or the snapshot surfaces on its own schedule rather than inside an
# unrelated review.
#
# Linux only. macOS is the author's own machine and is verified there daily;
# GitHub's macOS images move faster than GHC's bundled linker (the macOS 26
# image's 27.0 SDK already defeats GHC 9.10.3), so a hosted mac leg reports
# image drift, not project breakage. Windows has never been a target.
on:
  schedule:
    - cron: '0 5 * * 1'      # Mondays, 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Fresh clone (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10.3'
          enable-stack: true
          stack-version: 'latest'

      - name: Cache Stack store
        uses: actions/cache@v6
        with:
          path: ~/.stack
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml.lock', 'package.yaml') }}
          restore-keys: ${{ runner.os }}-stack-

      - name: Build
        run: stack build

      - name: Test
        run: stack test

      - name: Summarise
        if: always()
        run: |
          echo "- ubuntu-latest -> ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
