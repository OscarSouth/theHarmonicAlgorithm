name: Cross-platform build

# Kept OFF the pull-request path deliberately. Haskell CI on Windows is slow and
# prone to toolchain flakiness; making it a required check would stall ordinary work
# for reasons that have nothing to do with the change under review.
#
# This is the automated form of the "cross-platform clone verification" item in
# notes/v3-checklist.md — continuously, rather than once by hand.
on:
  schedule:
    - cron: '0 5 * * 1'      # Mondays, 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # one platform failing must not hide the others
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          enable-stack: true
          stack-version: 'latest'

      - name: Cache Stack store
        uses: actions/cache@v4
        with:
          path: ~/.stack
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml.lock', 'package.yaml') }}
          restore-keys: ${{ runner.os }}-stack-

      - name: Build
        run: stack build

      - name: Test
        run: stack test

      - name: Summarise
        if: always()
        shell: bash
        run: |
          echo "- ${{ matrix.os }} -> ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
