name:                theHarmonicAlgorithm
version:             3.0.0
license:             BSD3
author:              "Oscar South"
maintainer:          "oscarsouth@gmail.com"
copyright:           "2018-2026 Oscar South"
synopsis:            "Real-time harmonic progression generation for TidalCycles live performance"
description:         |
  A live performance instrument for generating and shaping harmonic
  progressions in real time while patterning musical data within them, trained
  on over 80 composers from the Yale Classical Archives Corpus. It integrates
  with TidalCycles via a kinetics framework handling form, five voicing
  strategies, a launcher paradigm \'conducting\' the musical abstracts
  reactively, and a preconfigured virtual orchestra mapping based on
  Stravinsky\'s ensemble for his composition \"Orphée\".

  == Start here

  * "Harmonic.Lib" — the single import for live coding. Re-exports everything
    below; a performance script needs nothing else.

  == Generating

  * "Harmonic.Framework.Builder" — the generative engine. Modifier-based API
    (@gen@, @genP@, @genFrom@), composer blending, and multi-attempt
    rank-and-select.
  * "Harmonic.Rules.Types.ProgressionContext" — the three-layer progression
    value (triad, strata, mode) that the @genP@ paradigm produces.

  == Playing

  * "Harmonic.Interface.Tidal.Bridge" — @arrange@, the bridge from a
    progression to a playable pattern.
  * "Harmonic.Interface.Tidal.Arranger" — voicing strategies (@grid@, @flow@,
    @lite@, @root@) and progression manipulation.
  * "Harmonic.Interface.Tidal.Form" — the form and kinetics framework.
  * "Harmonic.Interface.Tidal.Orchestra" — 15 orchestral instruments with
    built-in range clipping and divisi.
  * "Harmonic.Interface.Tidal.Groove" — sub-bass and kick patterns.
  * "Harmonic.Traversal.WalkingBass" — walking-bass line generation.

  == Music theory primitives

  * "Harmonic.Rules.Types.Pitch" — pitch-class algebra as the Z12 cyclic group.
  * "Harmonic.Rules.Types.Harmony" — chords, cadences and their concrete states.
  * "Harmonic.Rules.Types.Scale" — pentatonic, modal and octatripentatonic
    vocabulary.
  * "Harmonic.Rules.Constraints.Filter" — pitch-class set filtering.

  == Internals

  Corpus ingestion ("Harmonic.Rules.Import.CSV" and friends) and scoring
  ("Harmonic.Evaluation.Scoring.Dissonance", "Harmonic.Evaluation.Scoring.VoiceLeading")
  are not needed to generate or play music.
category:            "Music Composition"
homepage:            "https://github.com/OscarSouth/theHarmonicAlgorithm"
github:              "OscarSouth/theHarmonicAlgorithm"

dependencies:
  - base >= 4.14 && < 5
  - text
  - bytestring
  - containers
  - vector
  - array
  - mtl
  - stm
  - cassava
  - statistics
  - split
  - tidal
  - hosc
  - tidal-core
  - tidal-link
  # Phase C: Interactive Behaviour
  - aeson           # JSON: r.weights parsing and the Neo4j HTTP Query API
  - scientific      # aeson's number type, unwrapped in query results
  - http-client     # Neo4j HTTP Query API transport
  - random          # Base randomness for weighted selection
  - mwc-random      # High-quality gamma distribution sampling

library:
  exposed-modules:
    - Harmonic.Lib
    - Harmonic.Config
    - Harmonic.Database
    # Framework (R→E→T Orchestration)
    - Harmonic.Framework.Builder
    - Harmonic.Framework.Builder.Types
    - Harmonic.Framework.Builder.Core
    - Harmonic.Framework.Builder.Diagnostics
    - Harmonic.Framework.Builder.Portmanteau
    - Harmonic.Framework.Builder.Strata
    # Rules (R Component + Layer A)
    - Harmonic.Rules.Types.Pitch
    - Harmonic.Rules.Types.Harmony
    - Harmonic.Rules.Types.Progression
    - Harmonic.Rules.Types.ProgressionContext
    - Harmonic.Rules.Types.Scale
    - Harmonic.Rules.Constraints.Filter
    - Harmonic.Rules.Constraints.Overtone
    - Harmonic.Rules.Import.CSV
    - Harmonic.Rules.Import.Types
    - Harmonic.Rules.Import.Transform
    - Harmonic.Rules.Import.Graph
    # Evaluation (E Component + Layer C)
    - Harmonic.Evaluation.Scoring.Dissonance
    - Harmonic.Evaluation.Scoring.VoiceLeading
    - Harmonic.Evaluation.Scoring.Progression
    - Harmonic.Evaluation.Database.Query
    - Harmonic.Evaluation.Analysis.Markov
    # Traversal (T Component + Layer C)
    - Harmonic.Traversal.Probabilistic
    - Harmonic.Traversal.WalkingBass
    # Interface (Layer D)
    - Harmonic.Interface.Tidal.Bridge
    - Harmonic.Interface.Tidal.Arranger
    - Harmonic.Interface.Tidal.LineHarmony
    - Harmonic.Interface.Tidal.Form
    - Harmonic.Interface.Tidal.Groove
    - Harmonic.Interface.Tidal.Instruments
    - Harmonic.Interface.Tidal.Orchestra
    - Harmonic.Interface.Tidal.Utils
    - Harmonic.Interface.Tidal.OctatripentatonicT
  source-dirs: src
  # ghc-options:
    # - -Wall

executables:
  theHarmonicAlgorithm-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - theHarmonicAlgorithm
      - text
      - cassava
      - statistics
      - containers
tests:
  theHarmonicAlgorithm-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - theHarmonicAlgorithm
      - hspec
      - QuickCheck
      - containers
      - text
      - tidal